<script>
  // Claim scroll restoration before anything paints: an installed app otherwise
  // relaunches half-scrolled. Paint the right theme on the first frame, too.
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  (function () {
    var t = "system";
    try { t = JSON.parse(localStorage.getItem("donegoll.v1.prefs") || "{}").theme || "system"; } catch (e) {}
    var dark = t === "dark" || (t === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.js = "1";
    // failsafe: whatever happens in the modules, the opening never outstays four seconds
    setTimeout(function () { var b = document.getElementById("boot"); if (b) b.className += " gone"; }, 4000);
  })();
</script>

<body>

<!-- The opening: the wordmark, the rail drawn under it. Filled by js/boot.js. -->
<div id="boot" aria-hidden="true">
  <div class="boot-mark" id="boot-mark"></div>
  <div class="boot-rail"><i></i></div>
</div>

<!-- Top bar. iOS 26 grammar: glass buttons floating over the content, and a soft
     scroll-edge blur instead of a hard bar. The title arrives once the page's own
     large title has scrolled under it. -->
<header id="bar" class="bar" data-mode="clear">
  <div class="bar-edge" aria-hidden="true"></div>
  <div class="bar-l">
    <button class="gbtn" id="bar-back" type="button" aria-label="Back" hidden></button>
  </div>
  <a class="bar-c" id="bar-c" href="#/" aria-label="Done Goll home">
    <span class="bar-logo" id="bar-logo"></span>
    <span class="bar-title" id="bar-title"></span>
  </a>
  <div class="bar-r" id="bar-r"></div>
</header>

<main id="view" class="view"></main>

<!-- Fixed chrome a screen asks for (the checkout dock) lives out here: inside the
     screen, the entrance transform would make it a containing block and a backdrop
     root, and the dock would jump and lose its glass. -->
<div id="dock-root"></div>

<!-- Four tabs on liquid glass. The lens behind the active tab slides on a spring,
     and follows a finger dragged along the bar. -->
<nav id="tabs" class="tabs" aria-label="Primary">
  <span class="tabs-lens" id="tabs-lens" aria-hidden="true"></span>
  <a class="tab" data-tab="home" href="#/"><span class="tab-ico"></span><span class="tab-l">Home</span></a>
  <a class="tab" data-tab="shop" href="#/shop"><span class="tab-ico"></span><span class="tab-l">Shop</span></a>
  <a class="tab" data-tab="bag" href="#/bag"><span class="tab-ico"></span><span class="tab-l">Bag</span><span class="tab-badge" id="bag-badge" aria-hidden="true"></span></a>
  <a class="tab" data-tab="profile" href="#/profile"><span class="tab-ico"></span><span class="tab-l">Profile</span></a>
</nav>

<div id="fly-root" aria-hidden="true"></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite" aria-atomic="true"></div>

<noscript><p style="padding:24px;font:15px/1.5 system-ui">Done Goll needs JavaScript to run.</p></noscript>
</body>
